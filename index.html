<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Shreyas AI</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0a0a0f;
    --surface:#13131a;
    --border:#1f1f2e;
    --accent:#7c3aed;
    --accent2:#06d6a0;
    --accent3:#ff6b6b;
    --text:#e8e8f0;
    --muted:#6b6b80;
    --glow:0 0 30px rgba(124,58,237,0.3);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'Syne',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* GRID BACKGROUND */

body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(124,58,237,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,58,237,0.05) 1px, transparent 1px);
    background-size:40px 40px;
    animation:gridMove 20s linear infinite;
    z-index:0;
    pointer-events:none;
}

@keyframes gridMove{
    0%{
        transform:translateY(0);
    }
    100%{
        transform:translateY(40px);
    }
}

/* GLOW ORBS */

.orb{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.15;
    z-index:0;
    pointer-events:none;
}

.orb1{
    width:400px;
    height:400px;
    background:var(--accent);
    top:-100px;
    left:-100px;
    animation:float1 8s ease-in-out infinite;
}

.orb2{
    width:300px;
    height:300px;
    background:var(--accent2);
    bottom:-100px;
    right:-100px;
    animation:float2 10s ease-in-out infinite;
}

@keyframes float1{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(50px,50px);
    }
}

@keyframes float2{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(-50px,-30px);
    }
}

/* HEADER */

header{
    position:relative;
    z-index:10;
    padding:20px 24px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:14px;
    background:rgba(10,10,15,0.8);
    backdrop-filter:blur(20px);
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    box-shadow:var(--glow);
}

.header-text h1{
    font-size:18px;
    font-weight:800;
    background:linear-gradient(135deg,#fff,var(--accent2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.header-text p{
    font-size:11px;
    color:var(--muted);
    font-family:'Space Mono',monospace;
}

.status-dot{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--accent2);
    font-size:11px;
    font-family:'Space Mono',monospace;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent2);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
    }
    50%{
        opacity:0.4;
    }
}

/* QUICK ACTIONS */

.quick-actions{
    position:relative;
    z-index:10;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    scrollbar-width:none;
}

.quick-actions::-webkit-scrollbar{
    display:none;
}

.chip{
    flex-shrink:0;
    padding:6px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--muted);
    cursor:pointer;
    transition:0.2s;
    font-size:12px;
    white-space:nowrap;
    font-family:'Space Mono',monospace;
}

.chip:hover{
    border-color:var(--accent);
    color:var(--text);
    background:rgba(124,58,237,0.1);
}

/* CHAT */

#chat{
    position:relative;
    z-index:10;
    flex:1;
    overflow-y:auto;
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    gap:16px;
}

/* WELCOME */

.welcome{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:16px;
    height:100%;
}

.welcome-icon{
    width:80px;
    height:80px;
    border-radius:24px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    box-shadow:var(--glow);
}

.welcome h2{
    font-size:28px;
    font-weight:800;
}

.welcome p{
    color:var(--muted);
    max-width:300px;
    line-height:1.6;
}

/* MESSAGE */

.msg{
    display:flex;
    gap:10px;
    max-width:100%;
}

.msg.user{
    flex-direction:row-reverse;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.msg.user .avatar{
    background:linear-gradient(135deg,#ff6b6b,#ffa500);
}

.msg.ai .avatar{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.bubble{
    max-width:calc(100% - 50px);
    padding:12px 16px;
    border-radius:16px;
    line-height:1.7;
    word-break:break-word;
}

.msg.user .bubble{
    background:rgba(124,58,237,0.2);
    border:1px solid rgba(124,58,237,0.3);
}

.msg.ai .bubble{
    background:var(--surface);
    border:1px solid var(--border);
}

/* CODE */

pre{
    background:#0d0d14;
    border:1px solid var(--border);
    padding:12px;
    border-radius:10px;
    overflow-x:auto;
    margin-top:10px;
}

code{
    color:var(--accent2);
    font-family:'Space Mono',monospace;
}

/* INPUT AREA */

.input-area{
    position:relative;
    z-index:10;
    padding:14px;
    border-top:1px solid var(--border);
    background:rgba(10,10,15,0.9);
    backdrop-filter:blur(20px);
}

.input-box{
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:10px;
}

/* PLUS BUTTON */

.plus-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    font-size:22px;
    cursor:pointer;
    flex-shrink:0;
}

.plus-btn:hover{
    transform:scale(1.05);
}

/* TEXTAREA */

#userInput{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    resize:none;
    min-height:24px;
    max-height:120px;
    font-size:14px;
    font-family:'Syne',sans-serif;
}

#userInput::placeholder{
    color:var(--muted);
}

/* SEND BUTTON */

#sendBtn{
    width:40px;
    height:40px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

#sendBtn svg{
    width:18px;
    height:18px;
    fill:white;
}

/* UPLOAD PREVIEW */

#previewArea{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-bottom:10px;
}

.preview-item{
    position:relative;
}

.preview-item img,
.preview-item video{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid var(--border);
}

.remove-btn{
    position:absolute;
    top:-5px;
    right:-5px;
    width:22px;
    height:22px;
    border:none;
    border-radius:50%;
    background:red;
    color:white;
    cursor:pointer;
}

.input-hint{
    text-align:center;
    font-size:10px;
    color:var(--muted);
    margin-top:8px;
    font-family:'Space Mono',monospace;
}

</style>
</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<header>

    <div class="logo">🤖</div>

    <div class="header-text">
        <h1>Shreyas AI</h1>
        <p>Powered by AI Assistant</p>
    </div>

    <div class="status-dot">
        <div class="dot"></div>
        ONLINE
    </div>

</header>

<div class="quick-actions">

    <div class="chip" onclick="quickAsk('Write Python code')">
        🐍 Python
    </div>

    <div class="chip" onclick="quickAsk('Build website')">
        🌐 Website
    </div>

    <div class="chip" onclick="quickAsk('Photo editing tips')">
        📸 Photo Editing
    </div>

    <div class="chip" onclick="quickAsk('Business ideas')">
        💡 Business
    </div>

</div>

<div id="chat">

    <div class="welcome" id="welcome">

        <div class="welcome-icon">🤖</div>

        <h2>Hey, I'm Shreyas AI</h2>

        <p>
            Ask me coding, editing, AI, websites,
            business ideas, or anything.
        </p>

    </div>

</div>

<div class="input-area">

    <div id="previewArea"></div>

    <div class="input-box">

        <!-- PLUS BUTTON -->

        <button class="plus-btn" onclick="openFilePicker()">
            +
        </button>

        <!-- HIDDEN FILE INPUT -->

        <input
            type="file"
            id="fileInput"
            hidden
            multiple
            accept="image/*,video/*"
        >

        <!-- TEXTAREA -->

        <textarea
            id="userInput"
            rows="1"
            placeholder="Ask anything..."
        ></textarea>

        <!-- SEND BUTTON -->

        <button id="sendBtn" onclick="sendMessage()">

            <svg viewBox="0 0 24 24">
                <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
            </svg>

        </button>

    </div>

    <div class="input-hint">
        Enter = Send · Shift + Enter = New line
    </div>

</div>

<script>

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const welcomeEl = document.getElementById('welcome');
const fileInput = document.getElementById('fileInput');
const previewArea = document.getElementById('previewArea');

let uploadedFiles = [];
let conversationHistory = [];

/* AUTO RESIZE */

inputEl.addEventListener('input', function(){

    this.style.height = 'auto';

    this.style.height =
        Math.min(this.scrollHeight,120) + 'px';

});

/* ENTER SEND */

inputEl.addEventListener('keydown', function(e){

    if(e.key === 'Enter' && !e.shiftKey){

        e.preventDefault();

        sendMessage();

    }

});

/* QUICK ASK */

function quickAsk(text){

    inputEl.value = text;

    sendMessage();

}

/* FILE PICKER */

function openFilePicker(){

    fileInput.click();

}

/* FILE UPLOAD */

fileInput.addEventListener('change', function(){

    const files = Array.from(this.files);

    files.forEach(file => {

        uploadedFiles.push(file);

        const div = document.createElement('div');

        div.className = 'preview-item';

        if(file.type.startsWith('image')){

            const img = document.createElement('img');

            img.src = URL.createObjectURL(file);

            div.appendChild(img);

        }

        else if(file.type.startsWith('video')){

            const video = document.createElement('video');

            video.src = URL.createObjectURL(file);

            video.controls = true;

            div.appendChild(video);

        }

        const removeBtn = document.createElement('button');

        removeBtn.className = 'remove-btn';

        removeBtn.innerHTML = '×';

        removeBtn.onclick = () => {

            div.remove();

            uploadedFiles =
                uploadedFiles.filter(f => f !== file);

        };

        div.appendChild(removeBtn);

        previewArea.appendChild(div);

    });

});

/* ADD MESSAGE */

function addMessage(role,text){

    if(welcomeEl){
        welcomeEl.style.display = 'none';
    }

    const msg = document.createElement('div');

    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');

    avatar.className = 'avatar';

    avatar.textContent =
        role === 'user' ? '👤' : '🤖';

    const bubble = document.createElement('div');

    bubble.className = 'bubble';

    bubble.innerHTML = formatMessage(text);

    msg.appendChild(avatar);

    msg.appendChild(bubble);

    chatEl.appendChild(msg);

    chatEl.scrollTop = chatEl.scrollHeight;

}

/* FORMAT MESSAGE */

function formatMessage(text){

    text = text.replace(
        /```(\w+)?\n?([\s\S]*?)```/g,
        (match,lang,code) => {

            return `
                <pre>
                    <code>
${escapeHtml(code.trim())}
                    </code>
                </pre>
            `;

        }
    );

    text = text.replace(
        /\n/g,
        '<br>'
    );

    return text;

}

function escapeHtml(text){

    return text
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');

}

/* SEND MESSAGE */

async function sendMessage(){

    const text = inputEl.value.trim();

    if(!text && uploadedFiles.length === 0){
        return;
    }

    addMessage('user', text || '📎 Uploaded media');

    inputEl.value = '';

    inputEl.style.height = 'auto';

    /* AI GENERATION PLACE */

    addMessage(
        'ai',
        '✨ AI response will appear here after adding your API key.'
    );

    previewArea.innerHTML = '';

    uploadedFiles = [];

}

/* API PLACE */

async function callAI(userMessage){

    /*
    PUT YOUR API KEY HERE

    Example:

    const API_KEY = "YOUR_API_KEY";

    */

}

</script>

</body>
</html>
